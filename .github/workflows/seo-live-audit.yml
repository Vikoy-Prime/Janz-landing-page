name: AskMeJanice live SEO audit

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lighthouse
        run: npm install -g lighthouse

      - name: Check redirects and live resources
        run: |
          echo "=== HTTPS HEADERS ==="
          curl -sS -I https://askmejanice.com/ | head -n 25
          echo "=== HTTP REDIRECT ==="
          curl -sS -I http://askmejanice.com/ | head -n 25
          echo "=== ROBOTS ==="
          curl -sS -o /dev/null -w '%{http_code} %{content_type}\n' https://askmejanice.com/robots.txt
          echo "=== SITEMAP ==="
          curl -sS -o /dev/null -w '%{http_code} %{content_type}\n' https://askmejanice.com/sitemap.xml
          echo "=== OG IMAGE ==="
          curl -sS -o /dev/null -w '%{http_code} %{content_type} %{size_download}\n' https://askmejanice.com/askmejanice-social-preview.webp
          echo "=== PEXELS IMAGE ==="
          curl -L -sS -o /dev/null -w '%{http_code} %{content_type} %{size_download}\n' 'https://images.pexels.com/photos/1222949/pexels-photo-1222949.jpeg?auto=compress&w=1260&h=750&dpr=1'

      - name: Mobile Lighthouse audit
        run: |
          lighthouse https://askmejanice.com/ \
            --chrome-flags="--headless --no-sandbox" \
            --only-categories=performance,seo,accessibility,best-practices \
            --output=json \
            --output-path=mobile.json \
            --quiet
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('mobile.json','utf8'));
          const a=r.audits;
          console.log(JSON.stringify({
            mode:'mobile',
            performance:Math.round((r.categories.performance.score||0)*100),
            seo:Math.round((r.categories.seo.score||0)*100),
            accessibility:Math.round((r.categories.accessibility.score||0)*100),
            bestPractices:Math.round((r.categories['best-practices'].score||0)*100),
            fcp:a['first-contentful-paint']?.displayValue,
            lcp:a['largest-contentful-paint']?.displayValue,
            cls:a['cumulative-layout-shift']?.displayValue,
            tbt:a['total-blocking-time']?.displayValue,
            speedIndex:a['speed-index']?.displayValue,
            interactive:a['interactive']?.displayValue,
            unusedJs:a['unused-javascript']?.displayValue || null,
            renderBlocking:a['render-blocking-resources']?.displayValue || null
          },null,2));
          const failing=Object.values(r.audits)
            .filter(x=>x && typeof x.score==='number' && x.score<1 && x.scoreDisplayMode!=='notApplicable')
            .map(x=>({id:x.id,title:x.title,score:x.score,displayValue:x.displayValue||null}))
            .slice(0,40);
          console.log('FAILING_AUDITS='+JSON.stringify(failing));
          for (const id of ['color-contrast','label-content-name-mismatch','image-delivery-insight','cache-insight','deprecations','third-party-cookies']) {
            const d=a[id]?.details?.items || [];
            console.log('DETAIL_'+id+'='+JSON.stringify(d.slice(0,12)));
          }
          NODE

      - name: Desktop Lighthouse audit
        run: |
          lighthouse https://askmejanice.com/ \
            --preset=desktop \
            --chrome-flags="--headless --no-sandbox" \
            --only-categories=performance,seo,accessibility,best-practices \
            --output=json \
            --output-path=desktop.json \
            --quiet
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('desktop.json','utf8'));
          const a=r.audits;
          console.log(JSON.stringify({
            mode:'desktop',
            performance:Math.round((r.categories.performance.score||0)*100),
            seo:Math.round((r.categories.seo.score||0)*100),
            accessibility:Math.round((r.categories.accessibility.score||0)*100),
            bestPractices:Math.round((r.categories['best-practices'].score||0)*100),
            fcp:a['first-contentful-paint']?.displayValue,
            lcp:a['largest-contentful-paint']?.displayValue,
            cls:a['cumulative-layout-shift']?.displayValue,
            tbt:a['total-blocking-time']?.displayValue,
            speedIndex:a['speed-index']?.displayValue,
            interactive:a['interactive']?.displayValue
          },null,2));
          NODE
