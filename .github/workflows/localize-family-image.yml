name: Localize family image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/localize-family-image.yml'

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Download and optimize family image
        run: |
          curl -L --fail --retry 3 \
            'https://images.pexels.com/photos/1222949/pexels-photo-1222949.jpeg?auto=compress&w=1260&h=750&dpr=1' \
            -o /tmp/family.jpg

          convert /tmp/family.jpg -resize '640x381^' -gravity center -extent 640x381 -strip -quality 82 images/family-future-640.webp
          convert /tmp/family.jpg -resize '960x571^' -gravity center -extent 960x571 -strip -quality 82 images/family-future-960.webp
          convert /tmp/family.jpg -resize '1260x750^' -gravity center -extent 1260x750 -strip -quality 82 images/family-future-1260.webp

          identify images/family-future-640.webp
          identify images/family-future-960.webp
          identify images/family-future-1260.webp
          stat -c '%n %s bytes' images/family-future-*.webp

      - name: Commit local family images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/family-future-640.webp images/family-future-960.webp images/family-future-1260.webp
          git commit -m "Localize and optimize family image"
          git push origin main
