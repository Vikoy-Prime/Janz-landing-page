name: Optimize favicon

on:
  push:
    branches:
      - seo-performance-fix-2026-10-03
    paths:
      - '.github/workflows/optimize-favicon.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pngquant
        run: |
          sudo apt-get update
          sudo apt-get install -y pngquant

      - name: Compress favicon
        run: |
          echo "Before:"
          stat -c '%n %s bytes' favicon.png
          pngquant --quality=90-100 --speed 1 --skip-if-larger --force --output favicon.png favicon.png || true
          echo "After:"
          stat -c '%n %s bytes' favicon.png

      - name: Commit optimized favicon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add favicon.png
          if git diff --cached --quiet; then
            echo "No favicon change needed."
          else
            git commit -m "Optimize favicon asset"
            git push origin HEAD:seo-performance-fix-2026-10-03
          fi
