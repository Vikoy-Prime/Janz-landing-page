name: Verify Cloudflare crawler access

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check live responses
        run: |
          for url in             "https://askmejanice.com/"             "https://askmejanice.com/robots.txt"             "https://askmejanice.com/sitemap.xml"             "https://askmejanice.com/sitemap.txt"
          do
            echo "=== $url ==="
            curl -sS -I "$url" | head -n 12
          done
