name: Optimize AskMeJanice images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-images.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Optimize local WebP assets
        run: |
          echo "Before:"
          identify images/janice-logo.webp
          identify images/janice-hero.webp
          stat -c '%n %s bytes' images/janice-logo.webp images/janice-hero.webp

          mogrify -resize '256x256>' -strip -quality 84 images/janice-logo.webp
          mogrify -resize '800x900>' -strip -quality 84 images/janice-hero.webp

          echo "After:"
          identify images/janice-logo.webp
          identify images/janice-hero.webp
          stat -c '%n %s bytes' images/janice-logo.webp images/janice-hero.webp

      - name: Commit optimized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/janice-logo.webp images/janice-hero.webp
          if git diff --cached --quiet; then
            echo "No image changes needed."
          else
            git commit -m "Optimize Janice image assets"
            git push origin main
          fi
